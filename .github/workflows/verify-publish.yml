name: Verify and publish Docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: docker compose config --quiet
      - run: docker compose -f server/compose.yaml config --quiet

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: hongguotv-bridge:smoke
          cache-from: type=gha,scope=bridge-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bridge-${{ matrix.arch }}
      - run: bash scripts/smoke-docker.sh hongguotv-bridge:smoke

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Image coordinates
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hongguotv-bridge" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=bridge-amd64
            type=gha,scope=bridge-arm64
      - name: Published digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Published: $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
